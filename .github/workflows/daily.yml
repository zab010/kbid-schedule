name: 매일 공고 갱신

on:
  schedule:
    - cron: "0 19 * * *"   # UTC 19:00 = 한국 시간 오전 4시
  workflow_dispatch:        # Actions 화면에서 직접 실행

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 공고별로 찾은 주소를 저장해 두어 다음 날 원문을 다시 받지 않는다 (저장소에는 올라가지 않음)
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/cache.json
            data/geo.json
          key: notice-cache-${{ github.run_id }}
          restore-keys: notice-cache-

      - name: 공고 수집 및 사이트 만들기
        env:
          KBID_ID: ${{ secrets.KBID_ID }}
          KBID_PW: ${{ secrets.KBID_PW }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          TZ: Asia/Seoul
          BUDGET_MIN: "60"   # 60분이 넘으면 남은 공고는 다음 실행으로 넘기고 사이트를 만든다
        run: python run.py

      # 실패하거나 중간에 끊겨도 그때까지 받은 주소·좌표는 남겨 다음 실행이 이어서 하게 한다
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/cache.json
            data/geo.json
          key: notice-cache-${{ github.run_id }}-${{ github.run_attempt }}

      # 실행 도중 저장소에 다른 커밋(사이트 모양 수정 등)이 올라와도 밀려나지 않게:
      # 최신 저장소로 맞춘 뒤 최신 템플릿으로 사이트를 다시 만들어 올린다 (공고 자료 data/ 는 저장소 밖이라 그대로)
      - name: 사이트 올리기
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python kbid/build_site.py data/notices.json
            git add docs
            git diff --cached --quiet && exit 0
            git commit -q -m "공고 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
