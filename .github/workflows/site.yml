name: 사이트 모양 반영

# 템플릿(site/template.html 등)을 main에 합치면 바로 실행: 공고는 새로 받지 않고
# 지금 게시된 공고 자료로 사이트만 새 모양으로 다시 만들어 올린다 (1~2분).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "kbid/build_site.py"
      - "kbid/rebuild_site.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography

      # 그사이 공고 갱신 커밋이 올라와도 밀려나지 않게: 최신 main으로 맞춘 뒤 다시 만들어 올린다
      - name: 새 모양으로 사이트 다시 만들어 올리기
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python -m kbid.rebuild_site
            git add docs
            git diff --cached --quiet && exit 0
            git commit -q -m "사이트 모양 반영 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
